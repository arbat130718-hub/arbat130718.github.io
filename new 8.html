<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Brew Billiard Competition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 10px;
    }
    h2, h3 { margin-top: 1.2em; }
    button, label, select, input[type="number"] {
      display: block;
      width: 100%;
      margin: 6px 0;
      box-sizing: border-box;
    }
    fieldset {
      border: 1px solid #ccc;
      padding: 12px;
      margin-top: 10px;
    }
    legend { font-weight: bold; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }
    .hidden { display: none; }
    #resetBtn {
      display: inline-block;
      width: auto;
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 4px 8px;
      font-size: 0.9em;
      cursor: pointer;
    }
    .action-btn {
      width: auto;
      padding: 4px 8px;
      font-size: 0.9em;
      margin: 0 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🏆 Brew Billiard Competition</h2>
  <button id="resetBtn" onclick="confirmReset()">Mulai Kompetisi Baru</button>

  <!-- Stage 1 -->
  <fieldset id="stage1">
    <legend>1. Pilih Jumlah & Nama Pemain</legend>
    <label>
      Jumlah Pemain:
      <select id="playerCount">
        <option value="">– Pilih –</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </label>
    <div id="nameInputs"></div>
    <button onclick="savePlayers()">Simpan & Lanjutkan</button>
  </fieldset>

  <!-- Stage 2 -->
  <fieldset id="stage2" class="hidden">
    <legend>2. Atur Poin per Rangking</legend>
    <div id="scoringInputs"></div>
    <button onclick="saveScoring()">Simpan & Lanjutkan</button>
  </fieldset>

  <!-- Stage 3 -->
  <fieldset id="stage3" class="hidden">
    <legend>3. Input Hasil Pertandingan</legend>
    <div id="matchInputs"></div>
    <button onclick="submitMatch()">Submit Pertandingan</button>

    <h3>📊 Leaderboard</h3>
    <table>
      <thead>
        <tr><th>Peringkat</th><th>Nama</th><th>Total Poin</th></tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>

    <h3>🕒 History Pertandingan</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Peringkat Tiap Pemain</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </fieldset>

  <script>
    // Daftar nama yang boleh dipilih
    const allowedNames = [
      'Ari','Adolf','Lukas','Dodi',
      'Fahmi','Julian','Mario','Jere'
    ];

    let players = [];
    let playerCount = 0;
    let pointsMap = [];
    let matches = [];

    // Konfirmasi sebelum reset
    function confirmReset() {
      if (confirm("Yakin ingin memulai kompetisi baru?\nSemua data akan terhapus.")) {
        resetAll();
      }
    }

    // Reset semua ke awal
    function resetAll() {
      players = [];
      playerCount = 0;
      pointsMap = [];
      matches = [];
      document.getElementById('playerCount').value = '';
      document.getElementById('nameInputs').innerHTML = '';
      document.getElementById('scoringInputs').innerHTML = '';
      document.getElementById('matchInputs').innerHTML = '';
      document.getElementById('leaderboardBody').innerHTML = '';
      document.getElementById('historyBody').innerHTML = '';
      showStage('stage1');
    }

    // Stage 1: pilih jumlah & nama dari daftar
    document.getElementById('playerCount')
      .addEventListener('change', e => {
        const n = +e.target.value;
        const c = document.getElementById('nameInputs');
        c.innerHTML = '';
        for (let i = 1; i <= n; i++) {
          let sel = `<select id="name${i}" class="playerSelect">
            <option value="">– Pilih Nama –</option>
            ${allowedNames.map(nm =>
              `<option value="${nm}">${nm}</option>`
            ).join('')}
          </select>`;
          c.innerHTML += sel;
        }
      });

    function savePlayers() {
      const n = +document.getElementById('playerCount').value;
      if (n < 3 || n > 7) {
        alert('Pilih jumlah pemain antara 3 hingga 7.');
        return;
      }
      const tmp = [];
      for (let i = 1; i <= n; i++) {
        const v = document.getElementById(`name${i}`).value;
        if (!v) {
          alert('Semua nama pemain harus dipilih.');
          return;
        }
        tmp.push(v);
      }
      // cek duplikat
      const uniq = new Set(tmp);
      if (uniq.size !== tmp.length) {
        alert('Tidak boleh ada nama pemain ganda.');
        return;
      }
      playerCount = n;
      players = tmp;
      showStage('stage2');
      renderScoringForm();
    }

    // Stage 2: atur poin
    function renderScoringForm() {
      const defaultPts = {
        7: [8,6,5,4,3,2,1],
        6: [7,5,4,3,2,1],
        5: [6,4,3,2,1],
        4: [5,3,2,1],
        3: [4,2,1]
      }[playerCount];
      const c = document.getElementById('scoringInputs');
      c.innerHTML = `<h3>${playerCount} Pemain</h3>`;
      defaultPts.forEach((pt,i) => {
        c.innerHTML += `
          <label>Poin Rangking ${i+1}:
            <input type="number" id="pt${i}" min="0" value="${pt}" />
          </label>
        `;
      });
    }

    function saveScoring() {
      pointsMap = [];
      for (let i = 0; i < playerCount; i++) {
        const v = +document.getElementById(`pt${i}`).value;
        if (isNaN(v) || v < 0) {
          alert('Poin harus berupa angka ≥ 0.');
          return;
        }
        pointsMap.push(v);
      }
      showStage('stage3');
      renderMatchForm();
      updateLeaderboard();
      updateHistory();
    }

    // Stage 3: input match
    function renderMatchForm() {
      const c = document.getElementById('matchInputs');
      c.innerHTML = `<h3>Masukkan Peringkat Setiap Pemain</h3>`;
      players.forEach((nm,i) => {
        c.innerHTML += `
          <label>${nm}:
            <select id="rank${i}" class="rankSelect">
              <option value="">–</option>
              ${players.map((_,r) =>
                `<option value="${r+1}">${r+1}</option>`
              ).join('')}
            </select>
          </label>
        `;
      });
    }

    function submitMatch() {
      const sels = document.querySelectorAll('.rankSelect');
      const ranks = Array.from(sels).map(s =>
        s.value === '' ? null : +s.value
      );
      const filled = ranks.filter(r => r !== null);
      if (new Set(filled).size !== filled.length) {
        alert('Peringkat tidak boleh sama (kecuali “–”).');
        return;
      }
      matches.push(ranks);
      sels.forEach(s => s.value = '');
      updateLeaderboard();
      updateHistory();
    }

    // Leaderboard
    function updateLeaderboard() {
      const totals = {};
      players.forEach(n => totals[n] = 0);
      matches.forEach(ranks => {
        ranks.forEach((r,i) => {
          const pt = (r == null) ? 0 : pointsMap[r-1];
          totals[players[i]] += pt;
        });
      });
      const tb = document.getElementById('leaderboardBody');
      tb.innerHTML = '';
      Object.entries(totals)
        .sort((a,b) => b[1] - a[1])
        .forEach(([n,sc],i) => {
          tb.innerHTML += `<tr>
            <td>${i+1}</td><td>${n}</td><td>${sc}</td>
          </tr>`;
        });
    }

    // History + Edit
    function updateHistory() {
      const hb = document.getElementById('historyBody');
      hb.innerHTML = '';
      matches.forEach((ranks, idx) => {
        const txt = players
          .map((n,i) => `${n}: ${ranks[i]|| '-'}`)
          .join(' | ');
        hb.innerHTML += `<tr>
          <td>${idx+1}</td>
          <td>${txt}</td>
          <td>
            <button class="action-btn" onclick="editMatch(${idx})">
              Edit
            </button>
          </td>
        </tr>`;
      });
    }

    function editMatch(index) {
      // ambil dan remove entry
      const ranks = matches.splice(index, 1)[0];
      // render ulang form input match
      renderMatchForm();
      // isi kembali pilihan sesuai history
      ranks.forEach((r,i) => {
        document.getElementById(`rank${i}`).value = r == null ? '' : r;
      });
      updateLeaderboard();
      updateHistory();
    }

    // Utility: tampilkan hanya satu stage
    function showStage(id) {
      ['stage1','stage2','stage3'].forEach(s => {
        document.getElementById(s)
          .classList.toggle('hidden', s !== id);
      });
    }

    // Inisialisasi
    showStage('stage1');
  </script>
</body>
</html>
